name: Test and deploy Mineworld

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mineworld-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the world
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test world, movement, and saves
        run: npm test
      - name: Build
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test the rendered game
        run: npm run test:browser
      - name: Save screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mineworld-preview
          path: artifacts
          retention-days: 14
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  previews:
    if: always() && github.event_name != 'pull_request' && needs.build.result != 'cancelled'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Retrieve visual test results
        id: screenshots
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mineworld-preview
          path: preview
      - name: Keep the latest screenshots on the previews branch
        if: steps.screenshots.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs/promises');
            const { owner, repo } = context.repo;
            const files = (await fs.readdir('preview')).filter(name => name.endsWith('.jpg') || name === 'browser-report.txt');
            if (!files.length) return;
            let parent = context.sha;
            let exists = false;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/previews' });
              parent = ref.data.object.sha;
              exists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const tree = [];
            for (const name of files) {
              const bytes = await fs.readFile(`preview/${name}`);
              const blob = await github.rest.git.createBlob({ owner, repo, content: bytes.toString('base64'), encoding: 'base64' });
              tree.push({ path: name, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            const snapshot = await github.rest.git.createTree({ owner, repo, tree });
            const commit = await github.rest.git.createCommit({ owner, repo, message: `Visual checks for ${context.sha.slice(0, 7)}`, tree: snapshot.data.sha, parents: [parent] });
            if (exists) await github.rest.git.updateRef({ owner, repo, ref: 'heads/previews', sha: commit.data.sha, force: false });
            else await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/previews', sha: commit.data.sha });

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
